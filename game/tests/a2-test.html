  for(var ch=0;ch<2;ch++){var d=ir.getChannelData(ch),y=0;for(var i=0;i<len;i++){var x=(r()*2-1)*Math.exp(-i/c.sampleRate*5.2);y+=0.45*(x-y);d[i]=y;}}
  var cv=c.createConvolver();cv.buffer=ir;var inp=c.createGain(),w=c.createGain();w.gain.value=wet==null?0.5:wet;
  inp.connect(cv);cv.connect(w);w.connect(dest);return inp;
}

  W.gestured=true;
  if(own&&own.ctx.state==='suspended'&&shouldRunOwn()){try{own.ctx.resume();}catch(e){}}
  if(W.want)ensure();
}
['pointerdown','touchend','keydown','click'].forEach(function(ev){document.addEventListener(ev,gesture,true);});
window.addEventListener('sg-pause',function(){W.hold=Date.now()+6000;ownPauseSync();});
window.addEventListener('sg-resume',function(){W.hold=0;ownPauseSync();if(W.want)ensure();});
document.addEventListener('visibilitychange',function(){ownPauseSync();});
window.addEventListener('pageshow',function(){ownPauseSync();});
try{SG.bus.on('u:event',function(e){if(e&&e.type)A2.event(e.type,e.severity);});
SG.bus.on('disc:unlock',function(){A2.event('unlock');});
SG.bus.on('p:tier',function(){if(W.want)ensure();});}catch(e){}
timers.push(setInterval(function(){
  try{ensure();ownPauseSync();bellTick();
    if(G&&G.ctx.state==='running'){ // ses/sessiz ayarı değiştiyse seviyeyi güncelle (yumuşak)
      var t=G.ctx.currentTime;G.out.gain.setTargetAtTime(level()*SPD.lvl[SG.clamp(W.speed|0,0,4)],t,0.6);
    }
  }catch(e){SG.log.err('a2:tick',e);}
},1000));
})();
</script>
<script>
var B=document.getElementById('b');
function btn(t,f){var x=document.createElement('button');x.textContent=t;x.style.cssText='margin:3px;padding:10px';x.onclick=f;B.appendChild(x);}
['universe','galaxy','system','planet'].forEach(function(s){btn(s,function(){SG.A2.setScale(s)})});
[0,1,2,3,4].forEach(function(i){btn('hız '+i,function(){SG.A2.setSpeed(i)})});
['supernova','nova','comet','nebula','stellar-birth','star-dies','habitable-shift','collision','unlock'].forEach(function(e){btn(e,function(){SG.A2.event(e,2)})});
['tap','open','close','unlock','error'].forEach(function(k){btn('ui:'+k,function(){SG.A2.ui(k)})});
btn('başlat',function(){SG.A.unlock();SG.A2.start()});btn('durdur',function(){SG.A2.stop()});
window.rms=function(){var an=SG.A2._tap();if(!an)return -1;var d=new Float32Array(an.fftSize);an.getFloatTimeDomainData(d);var s=0;for(var i=0;i<d.length;i++)s+=d[i]*d[i];return Math.sqrt(s/d.length);};
setInterval(function(){document.getElementById('o').textContent=JSON.stringify(SG.A2.state())+' rms='+window.rms().toFixed(5)+' err='+SG.log.list.join('|');},500);
</script>
