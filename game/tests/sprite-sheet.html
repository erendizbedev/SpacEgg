<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><title>SG.Sp sprite sayfası</title>
<style>body{margin:0;background:#04050d;color:#9aa1c4;font:12px system-ui}#info{position:fixed;left:8px;bottom:6px;font-size:11px;color:#6c749c;background:#0008;padding:2px 6px}</style></head>
<body><script>window.__err=[];window.onerror=function(m,u,l){__err.push(m+'@'+l);};</script><canvas id="c"></canvas><div id="info"></div>
<script>
var SG=window.SG={RM:false,rng:null};
(function(){var qs=new URLSearchParams(location.search);var Q=+(qs.get('q')||1);SG.P={tier:function(){return Q;}};SG.RM=qs.get('rm')==='1';})();
</script>
<script>/* SpacEgg 2.0 — SG.Sp: sprite ve malzeme katmanı (Teknik Sanatçı)
   Galaksi, yıldız, gezegen, uydu, bulutsu ve arka plan çizimleri. Hepsi ctx'e çizer.
   Kurallar: deterministik (id/seed'den), önbellekli offscreen sprite, kare başı yeni canvas yok,
   SG.P.tier() ile ayrıntı, SG.RM'de animasyon yok. */
(function(){
'use strict';
var SG=window.SG=window.SG||{};
var PI=Math.PI,TAU=PI*2,M=Math;

/* ---------- yardımcılar ---------- */
function tier(){try{var t=SG.P&&SG.P.tier&&SG.P.tier();return(t===0||t===1||t===2)?t:1;}catch(e){return 1;}}
function mk(w,h){var c=document.createElement('canvas');c.width=M.max(1,w|0);c.height=M.max(1,h|0);return c;}
function hashS(s){s=String(s);var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=M.imul(h,16777619)>>>0;}return h>>>0;}
function rngOf(seed){
  if(SG.rng)return SG.rng(seed);
  var a=(typeof seed==='number'?seed:hashS(seed))>>>0;
  return function(){a|=0;a=a+0x6D2B79F5|0;var t=M.imul(a^a>>>15,1|a);t=t+M.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
}
function h01(s){return hashS(s)/4294967296;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function sstep(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);}
function mixc(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function hsl(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;var a=s*M.min(l,1-l);
  function f(n){var k=(n+h/30)%12;return l-a*M.max(-1,M.min(k-3,M.min(9-k,1)));}
  return[M.round(f(0)*255),M.round(f(8)*255),M.round(f(4)*255)];}
function rgba(c,a){return'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a==null?1:+a.toFixed(3))+')';}
function gs(r){return(r()+r()+r()+r()-2)*1.73;} /* ~N(0,1) */

/* ---------- palet ---------- */
var PAL={
  cls:{O:[155,176,255],B:[170,191,255],A:[202,215,255],F:[248,247,255],G:[255,236,170],K:[255,196,130],M:[255,128,100]},
  type:{rocky:[176,160,146],ocean:[62,128,214],ice:[196,232,250],gas:[226,178,120],lava:[255,110,50],desert:[226,164,88],ringed:[232,205,150],moon:[176,176,182]},
  kind:{spiral:[150,170,255],barred:[190,150,255],elliptical:[255,205,150],irregular:[120,220,255]},
  phase:{protostar:[255,140,90],main:null,giant:[255,110,60],dwarf:[210,230,255],neutron:[140,230,255],blackhole:[255,170,80]},
  bg:'#04050d',
  ui:{ink:'#eef1ff',mute:'#9aa1c4',accent:'#4DD6FF',accent2:'#8f7bff',gold:'#FFC83D',ok:'#46E39B',bad:'#FF5A4D',warn:'#FFB23D',cold:'#BFE6FF'},
  tag:{gercek:'#46E39B',basit:'#4DD6FF',kurgu:'#B15CFF'}
};
function css(c){return'rgb('+c[0]+','+c[1]+','+c[2]+')';}

/* ---------- önbellek ---------- */
var C=new Map(),CMAX=160;
function cget(k){return C.get(k);}
function cset(k,v){C.set(k,v);if(C.size>CMAX){C.delete(C.keys().next().value);}return v;}
var PS=new Map(),PSMAX=10;           /* gezegen dokuları (ağır) */
var GEO=new Map();                   /* küre geometrisi tabloları */
var stat={gen:0,genMs:0,lastGenMs:0,render:0};

/* ---------- 3B değer gürültüsü ---------- */
function hh3(x,y,z,s){var n=M.imul(x,374761393)+M.imul(y,668265263)+M.imul(z,1274126177)+M.imul(s,362437)|0;n=M.imul(n^(n>>>13),1274126177);n^=n>>>16;return(n>>>0)/4294967296;}
function noise3(x,y,z,s){
  var xi=M.floor(x),yi=M.floor(y),zi=M.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
  var u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  var a=hh3(xi,yi,zi,s),b=hh3(xi+1,yi,zi,s),c=hh3(xi,yi+1,zi,s),d=hh3(xi+1,yi+1,zi,s);
  var e=hh3(xi,yi,zi+1,s),f=hh3(xi+1,yi,zi+1,s),g=hh3(xi,yi+1,zi+1,s),h=hh3(xi+1,yi+1,zi+1,s);
  var x1=a+(b-a)*u,x2=c+(d-c)*u,x3=e+(f-e)*u,x4=g+(h-g)*u;
  var y1=x1+(x2-x1)*v,y2=x3+(x4-x3)*v;
  return y1+(y2-y1)*w;
}
function fbm(x,y,z,oct,s){var sum=0,amp=.5,tot=0;for(var i=0;i<oct;i++){sum+=amp*noise3(x,y,z,s+i*17);tot+=amp;x*=2.03;y*=2.03;z*=2.03;amp*=.5;}return sum/tot;}
function stretch(v){return clamp((v-.5)*1.9+.5,0,1);} /* fbm aralığını yay */

/* ================================================================
   ARKA PLAN: paralaks yıldız tozu
   ================================================================ */
function bgTile(l,q){
  var key='bgt|'+l+'|'+q,c=cget(key);if(c)return c;
  var T=[384,512,640][q],n=[[34,18,10],[56,30,16],[84,44,24]][q][l];
  c=mk(T,T);var x=c.getContext('2d'),r=rngOf('bg'+l);
  for(var i=0;i<n;i++){
    var px=r()*T,py=r()*T,w=r(),sz=l===0?.7+r()*.6:l===1?1+r()*.8:1.4+r()*1.4;
    var col=w<.62?[225,232,255]:w<.84?[190,208,255]:w<.95?[255,232,200]:[255,190,160];
    var a=(l===0?.35:l===1?.55:.8)*(.6+r()*.4);
    x.fillStyle=rgba(col,a);x.beginPath();x.arc(px,py,sz,0,TAU);x.fill();
    if(l===2&&r()<.35){var g=x.createRadialGradient(px,py,0,px,py,sz*5);g.addColorStop(0,rgba(col,.28));g.addColorStop(1,rgba(col,0));x.fillStyle=g;x.fillRect(px-sz*5,py-sz*5,sz*10,sz*10);}
  }
  return cset(key,c);
}
var BGF=[.018,.05,.11],BGD=[2.2,4.5,8];
function bg(ctx,w,h,t,o){
  o=o||{};var q=o.q!=null?o.q:tier(),px=o.px||0,py=o.py||0,anim=!SG.RM;t=t||0;
  ctx.save();
  var g=ctx.createRadialGradient(w*.5,h*.1,0,w*.5,h*.4,M.max(w,h)*.9);
  g.addColorStop(0,'#10143a');g.addColorStop(.55,'#070a1c');g.addColorStop(1,PAL.bg);
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  if(o.nebula){var nb=nebula(o.nebula,w,h,q);ctx.globalAlpha=.4;ctx.drawImage(nb,0,0,w,h);ctx.globalAlpha=1;}
  var nl=q===0?2:3;
  for(var l=0;l<nl;l++){
    var tile=bgTile(l,q),T=tile.width;
    var ox=-(px*BGF[l])+(anim?t*BGD[l]:0),oy=-(py*BGF[l])+(anim?t*BGD[l]*.3:0);
    ox=((ox%T)+T)%T;oy=((oy%T)+T)%T;
    ctx.globalAlpha=(l===2&&anim)?.82+.18*M.sin(t*.7):1;
    for(var yy=-oy;yy<h;yy+=T)for(var xx=-ox;xx<w;xx+=T)ctx.drawImage(tile,xx,yy);
  }
  ctx.restore();
}

/* ================================================================
   BULUTSU
   ================================================================ */
function nebula(seed,w,h,q){
  q=q==null?tier():q;seed=String(seed);
  var lim=[200,300,420][q],sc=M.min(1,lim/M.max(w,h));
  var W=M.max(48,M.round(w*sc)),H=M.max(48,M.round(h*sc));
  var key='nb|'+seed+'|'+W+'x'+H+'|'+q,c=cget(key);if(c)return c;
  var r=rngOf('nb'+seed),h1=r()*360,h2=h1+30+r()*90,s1=(r()*1e4)|0,s2=(r()*1e4)|0,s3=(r()*1e4)|0;
  var c1=hsl(h1,75,58),c2=hsl(h2,80,52),oct=[3,4,5][q],f=2.2+r()*1.4;
  c=mk(W,H);var x=c.getContext('2d'),img=x.createImageData(W,H),d=img.data;
  for(var j=0;j<H;j++)for(var i=0;i<W;i++){
    var u=i/W*f,v=j/H*f*(H/W);
    var a=fbm(u,v,.37,oct,s1),b=fbm(u*1.3+4,v*1.3,5.1,oct,s2),k=fbm(u*.8,v*.8+9,2.3,3,s3);
    var den=sstep(.42,.82,a)*(.35+.65*b);den*=1-sstep(.58,.78,k)*.55;
    var col=mixc(c1,c2,b),p=(j*W+i)*4;
    d[p]=col[0];d[p+1]=col[1];d[p+2]=col[2];d[p+3]=M.min(255,den*235);
  }
  x.putImageData(img,0,0);c.sgScale=w/W;
  return cset(key,c);
}

/* ================================================================
   GALAKSİ
   ================================================================ */
function galaxySprite(g,q){
  var key='gx|'+g.id+'|'+g.kind+'|'+(g.hue|0)+'|'+(g.arms||2)+'|'+q,c=cget(key);if(c)return c;
  var S=[192,320,448][q],N=[1400,3200,6000][q],R=S/2,cx=R,cy=R;
  c=mk(S,S);var x=c.getContext('2d'),r=rngOf('gx'+g.id+g.kind);
  var hue=g.hue!=null?g.hue:220,cool=hsl(hue,72,70),warm=[255,226,180],kind=g.kind||'spiral';
  var big=S>=320?1.6:1.2;
  function dot(px,py,sz,col,a){x.fillStyle=rgba(col,a);x.fillRect(px-sz/2,py-sz/2,sz,sz);}
  x.globalCompositeOperation='lighter';
  var gr=x.createRadialGradient(cx,cy,0,cx,cy,R);
  gr.addColorStop(0,rgba(cool,.16));gr.addColorStop(.6,rgba(cool,.05));gr.addColorStop(1,rgba(cool,0));
  x.fillStyle=gr;x.fillRect(0,0,S,S);
  var i;
  if(kind==='spiral'||kind==='barred'){
    var bar=kind==='barred',arms=bar?2:(g.arms||2),wind=3.0+r()*1.6;
    var lanes=[];
    for(i=0;i<N;i++){
      var px,py,d,rad=M.pow(r(),.58);
      if(bar&&i%100<34){var u=r()*2-1;px=cx+u*.36*R*.95;py=cy+gs(r)*.035*R;}
      else{
        var arm=(r()*arms)|0,rr=bar?.3+.7*rad:rad;
        var th=arm*(bar?PI:TAU/arms)+(rr-(bar?.3:0))*wind*1.5+gs(r)*(.12+.22*rr);
        px=cx+M.cos(th)*rr*R*.93;py=cy+M.sin(th)*rr*R*.93;
      }
      d=M.min(1,M.hypot(px-cx,py-cy)/R);
      var col=mixc(warm,cool,M.pow(d,.7)),a=.14+.42*(1-d)*(1-d*.5);
      dot(px,py,r()<.1?big*1.8:big*1.05,col,a);
      if(i%5===0)dot(px,py,big*6,col,.03*(1-d*.6));
    }
    var kn=(N/45)|0;
    for(i=0;i<kn;i++){
      var arm2=(r()*arms)|0,rr2=(bar?.3:.1)+(bar?.7:.9)*r();
      var th2=arm2*(bar?PI:TAU/arms)+(rr2-(bar?.3:0))*wind*1.5+gs(r)*.06;
      var hx=cx+M.cos(th2)*rr2*R*.93,hy=cy+M.sin(th2)*rr2*R*.93;
      var kg=x.createRadialGradient(hx,hy,0,hx,hy,big*3.2);kg.addColorStop(0,'rgba(255,170,220,.5)');kg.addColorStop(1,'rgba(255,170,220,0)');
      x.fillStyle=kg;x.fillRect(hx-5,hy-5,10,10);
    }
    if(q>=1){
      x.globalCompositeOperation='source-over';x.lineCap='round';x.strokeStyle='rgba(3,4,14,.3)';x.lineWidth=S*.014;
      for(var ar=0;ar<arms;ar++){
        x.beginPath();
        for(var s=0;s<=40;s++){var rr3=(bar?.3:.12)+(bar?.68:.8)*s/40,th3=ar*(bar?PI:TAU/arms)+(rr3-(bar?.3:0))*wind*1.5+.2;
          var lx=cx+M.cos(th3)*rr3*R*.93,ly=cy+M.sin(th3)*rr3*R*.93;if(s)x.lineTo(lx,ly);else x.moveTo(lx,ly);}
        x.stroke();
      }
      x.globalCompositeOperation='lighter';
    }
    var cg=x.createRadialGradient(cx,cy,0,cx,cy,R*.34);
    cg.addColorStop(0,'rgba(255,240,215,.95)');cg.addColorStop(.25,'rgba(255,214,160,.5)');cg.addColorStop(1,'rgba(255,200,140,0)');
    x.fillStyle=cg;x.fillRect(0,0,S,S);
  }else if(kind==='elliptical'){
    var e=.68+r()*.27,ca=r()*PI;
    for(i=0;i<N*.85;i++){
      var an=r()*TAU,rd=M.pow(r(),1.9)*.92*R,ex=M.cos(an)*rd,ey=M.sin(an)*rd*e;
      px=cx+ex*M.cos(ca)-ey*M.sin(ca);py=cy+ex*M.sin(ca)+ey*M.cos(ca);
      d=M.min(1,rd/R);dot(px,py,big*.9,mixc([255,214,160],[255,160,110],d),.08+.3*(1-d));
    }
    var eg=x.createRadialGradient(cx,cy,0,cx,cy,R*.7);
    eg.addColorStop(0,'rgba(255,225,185,.85)');eg.addColorStop(.35,'rgba(255,190,130,.28)');eg.addColorStop(1,'rgba(255,170,110,0)');
    x.fillStyle=eg;x.fillRect(0,0,S,S);
  }else{ /* irregular */
    var k=4+((r()*3)|0);
    for(var cl=0;cl<k;cl++){
      var ccx=cx+gs(r)*R*.28,ccy=cy+gs(r)*R*.28,sg=R*(.1+r()*.12),ch=hsl(hue+gs(r)*30,80,64);
      for(i=0;i<N/k*.8;i++){px=ccx+gs(r)*sg;py=ccy+gs(r)*sg*(.6+r()*.5);
        if(M.hypot(px-cx,py-cy)<R*.95)dot(px,py,big*.9,mixc(ch,[255,150,220],r()*.4),.1+.3*r());}
      var cg2=x.createRadialGradient(ccx,ccy,0,ccx,ccy,sg*1.6);cg2.addColorStop(0,rgba(ch,.22));cg2.addColorStop(1,rgba(ch,0));
      x.fillStyle=cg2;x.fillRect(ccx-sg*2,ccy-sg*2,sg*4,sg*4);
    }
    for(i=0;i<N*.2;i++){var an2=r()*TAU,rd2=M.pow(r(),.7)*R*.9;dot(cx+M.cos(an2)*rd2,cy+M.sin(an2)*rd2,big*.8,cool,.06+.14*r());}
  }
  return cset(key,c);
}
function galaxy(ctx,g,cx,cy,radius,time,o){
  if(!g||radius<.5)return;
  var q=o&&o.q!=null?o.q:tier(),s=galaxySprite(g,q),hv=h01(g.id||'g');
  var kind=g.kind||'spiral',tilt=kind==='elliptical'?.85+hv*.14:kind==='irregular'?.7+hv*.25:.55+hv*.4;
  var ang=g.rot||hv*TAU,spin=SG.RM?0:(time||0)*(.012+hv*.01)*(hv<.5?1:-1);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);ctx.scale(1,tilt);ctx.rotate(spin);
  ctx.globalCompositeOperation='lighter';ctx.imageSmoothingEnabled=true;
  ctx.drawImage(s,-radius,-radius,radius*2,radius*2);
  ctx.restore();
}

/* ================================================================
   YILDIZ
   ================================================================ */
function starStyle(st){
  var cls=st.cls||'G',ph=st.phase||'main',col=PAL.cls[cls]||PAL.cls.G,k=1,gk=1;
  if(ph==='protostar'){col=[255,150,100];k=.9;gk=.8;}
  else if(ph==='giant'){col=mixc([255,118,64],col,.15);k=1.7;gk=1.5;}
  else if(ph==='dwarf'){col=[214,232,255];k=.5;gk=.9;}
  else if(ph==='neutron'){col=[150,232,255];k=.2;gk=1.4;}
  else if(ph==='blackhole'){col=[255,170,90];k=.62;gk=1.2;}
  return{col:col,k:k,gk:gk,ph:ph,cls:cls};
}
function glowSprite(col,q){
  var key='gl|'+col.map(M.round).join(',')+'|'+q,c=cget(key);if(c)return c;
  var S=[96,128,192][q];c=mk(S,S);var x=c.getContext('2d'),m=S/2;
  var g=x.createRadialGradient(m,m,0,m,m,m);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.12,rgba(col,.95));g.addColorStop(.28,rgba(col,.38));g.addColorStop(.6,rgba(col,.08));g.addColorStop(1,rgba(col,0));
  x.fillStyle=g;x.fillRect(0,0,S,S);return cset(key,c);
}
function lineSprite(col,len,thick){ /* iki ucu sönen ışın (lens/jet/ışın) */
  var key='ln|'+col.map(M.round).join(',')+'|'+len+'|'+thick,c=cget(key);if(c)return c;
  c=mk(len,thick);var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,len,0);g.addColorStop(0,rgba(col,0));g.addColorStop(.5,rgba(col,.85));g.addColorStop(1,rgba(col,0));
  x.fillStyle=g;x.fillRect(0,0,len,thick);
  x.globalCompositeOperation='destination-in';
  var v=x.createLinearGradient(0,0,0,thick);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(.5,'#000');v.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=v;x.fillRect(0,0,len,thick);return cset(key,c);
}
function bhSprite(q){
  var key='bh|'+q,c=cget(key);if(c)return c;
  var S=[192,256,320][q],m=S/2,hole=S*.11,orx=S*.46,ory=S*.13,irx=S*.17;
  c=mk(S,S);var x=c.getContext('2d');
  function ring(half){
    x.save();x.translate(m,m);x.rotate(-.18);
    if(half){x.beginPath();x.rect(-S,0,S*2,S);x.clip();}
    x.beginPath();x.ellipse(0,0,orx,ory,0,0,TAU);x.ellipse(0,0,irx,irx*.34,0,0,TAU,true);
    var g;
    if(x.createConicGradient){g=x.createConicGradient(0,0,0);g.addColorStop(0,'rgba(255,240,210,.95)');g.addColorStop(.25,'rgba(255,170,80,.55)');g.addColorStop(.5,'rgba(190,80,40,.3)');g.addColorStop(.75,'rgba(255,170,80,.55)');g.addColorStop(1,'rgba(255,240,210,.95)');}
    else{g=x.createLinearGradient(-orx,0,orx,0);g.addColorStop(0,'rgba(255,240,210,.95)');g.addColorStop(1,'rgba(190,80,40,.3)');}
    x.fillStyle=g;x.fill('evenodd');x.restore();
  }
  x.globalCompositeOperation='lighter';ring(false);
  x.globalCompositeOperation='source-over';x.fillStyle='#000';x.beginPath();x.arc(m,m,hole,0,TAU);x.fill();
  x.globalCompositeOperation='lighter';ring(true);
  x.save();x.shadowColor='rgba(255,190,110,.9)';x.shadowBlur=S*.03;x.strokeStyle='rgba(255,226,180,.9)';x.lineWidth=S*.008;
  x.beginPath();x.arc(m,m,hole*1.08,0,TAU);x.stroke();x.restore();
  x.strokeStyle='rgba(255,170,90,.4)';x.lineWidth=S*.014;x.beginPath();x.ellipse(m,m,hole*1.5,hole*1.28,-.18,PI*1.05,PI*1.95);x.stroke();
  return cset(key,c);
}
function bodyDisc(ctx,cx,cy,r,col,limb){
  var g=ctx.createRadialGradient(cx-r*.25,cy-r*.25,r*.05,cx,cy,r);
  g.addColorStop(0,css(mixc(col,[255,255,255],.75)));g.addColorStop(.55,css(col));g.addColorStop(1,css(mixc(col,[20,10,10],limb)));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();
}
function star(ctx,st,cx,cy,radius,time,o){
  if(!st||radius<.3)return;
  var q=o&&o.q!=null?o.q:tier(),sty=starStyle(st),rb=radius*sty.k,col=sty.col,anim=!SG.RM;time=time||0;
  var pulse=anim?1+.035*M.sin(time*1.7+h01(st.id||'s')*TAU):1;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.imageSmoothingEnabled=true;
  if(sty.ph==='blackhole'){
    var s=bhSprite(q),f=rb/(s.width*.11);ctx.drawImage(s,cx-s.width*f/2,cy-s.height*f/2,s.width*f,s.height*f);
    var gs2=glowSprite([255,150,70],q),gw=rb*10;ctx.globalAlpha=.35*pulse;ctx.drawImage(gs2,cx-gw/2,cy-gw/2,gw,gw);ctx.restore();return;
  }

function tintFor(type,cl,hue){
