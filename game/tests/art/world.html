<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390,initial-scale=1">
<style>html,body{margin:0;background:#0b1630;overflow:hidden}canvas{display:block;width:390px;height:800px}</style></head>
<body><canvas id="c"></canvas>
<script>
window.SG={rng:function(seed){var a=seed|0;return function(){a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};},hash:function(s){var h=0;s=String(s);for(var i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0;}};
window.__errs=[];window.addEventListener('error',function(e){window.__errs.push(e.message)});
</script>
<script src="../../src/63-iso-world.js"></script>
<script src="../../src/64-iso-buildings.js"></script>
<script>
var q=new URLSearchParams(location.search),mode=q.get('mode')||'world';
var cv=document.getElementById('c'),DPR=2;cv.width=390*DPR;cv.height=800*DPR;
var ctx=cv.getContext('2d');
var TYPES=SG.Iso.building.TYPES,CIVS=SG.Iso.CIVS;
var T=+(q.get('t')||2.3),night=+(q.get('night')||0),civ=q.get('civ')||'cinar',seed=q.get('seed')||'spac1';
function sc(){ctx.setTransform(DPR,0,0,DPR,0,0);}
function label(s,x,y){ctx.fillStyle='rgba(0,0,0,.55)';ctx.font='9px monospace';ctx.fillText(s,x,y);}
var W,perf={};
function frame(){
 sc();ctx.clearRect(0,0,390,800);
 if(mode==='world'){
  W=W||SG.Iso.World.make(seed,civ);
  var cam=SG.Iso.World.fitCam(W,390,800,6);cam.zoom=+(q.get('zoom')||cam.zoom);if(q.get('focus')){var s0=W.slots[0];cam.x=(s0.i-s0.j)*32+(+q.get('ox')||0);cam.y=(s0.i+s0.j)*16+(+q.get('oy')||0);}
  var t0=performance.now();
  SG.Iso.World.draw(ctx,W,cam,T,{night:night,w:390,h:800});
  perf.world=performance.now()-t0;t0=performance.now();SG.Iso.World.draw(ctx,W,cam,T,{night:night,w:390,h:800});perf.world2=performance.now()-t0;ctx.clearRect(0,0,390,800);SG.Iso.World.draw(ctx,W,cam,T,{night:night,w:390,h:800});
  var types=['hall','house','house','farm','farm','mine','quarry','power','lab','barracks','wall','depot','house','house','house','house','house','house'];
  var lvs=[3,2,1,2,3,3,2,3,2,3,2,2,4,1,2,3,1,2];
  t0=performance.now();
  var ord=W.slots.map(function(s,i){return[s,i]}).sort(function(a,b){return (a[0].i+a[0].j)-(b[0].i+b[0].j)});
  ord.forEach(function(e){var s=e[0],i=e[1];var p=SG.Iso.World.toScreen(W,cam,s.i,s.j);var ty=s.type||types[i%types.length];
   SG.Iso.building(ctx,ty,lvs[i%lvs.length],civ,p.x,p.y,{t:T,scale:cam.zoom,night:night,dir:W.port.dir===1&&s.type==='port'});});
  perf.b=performance.now()-t0;
  var pp=SG.Iso.World.toScreen(W,cam,W.pad.i,W.pad.j);
  window.__info={slots:W.slots.length,pad:W.pad,port:W.port,river:W.river.length,zoom:cam.zoom,perf:perf,land:Array.prototype.filter.call(W.kind,function(k){return k>0}).length};
 }else if(mode==='grid'){
  var scale=+(q.get('scale')||.6);
  ctx.fillStyle=q.get('bg')||'#79b565';ctx.fillRect(0,0,390,800);
  var gc=SG.Iso.civPal(civ);
  TYPES.forEach(function(ty,r){
   var y=r*72+52;label(ty,2,y-28);
   for(var L=1;L<=5;L++){var x=39+(L-1)*78;
    // karo elması
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.moveTo(x,y-16*scale);ctx.lineTo(x+32*scale,y);ctx.lineTo(x,y+16*scale);ctx.lineTo(x-32*scale,y);ctx.fill();
    SG.Iso.building(ctx,ty,L,civ,x,y,{t:T,scale:scale,night:night,dir:+(q.get('dir')||0)});}
  });
 }else if(mode==='type'){
  var ty=q.get('type')||'hall',scale=+(q.get('scale')||1.15);
  ctx.fillStyle=q.get('bg')||'#79b565';ctx.fillRect(0,0,390,800);
  for(var L=1;L<=5;L++){var col=(L-1)%2,row=(L-1)>>1;var x=100+col*190,y=210+row*210;if(L===5){x=195;}
   ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.moveTo(x,y-16*scale);ctx.lineTo(x+32*scale,y);ctx.lineTo(x,y+16*scale);ctx.lineTo(x-32*scale,y);ctx.fill();
   label(ty+' L'+L,x-20,y+44);
   SG.Iso.building(ctx,ty,L,civ,x,y,{t:T,scale:scale,night:night,dir:+(q.get('dir')||0),selected:q.get('sel')==='1'&&L===2,progress:q.get('prog')&&L===3?+q.get('prog'):undefined,damaged:q.get('dmg')&&L===4?+q.get('dmg'):0});}
 }else if(mode==='civ'){
  var scale=+(q.get('scale')||.62);ctx.fillStyle=q.get('bg')||'#79b565';ctx.fillRect(0,0,390,800);
  var list=(q.get('civs')||'kulhan,lumeren,karaoz,ipekci,buzag,kirkbicak').split(',');
  var tys=['hall','house','farm','mine','quarry','power','lab','barracks','wall','port','depot'];
  list.forEach(function(c,ci){var col=ci%2,row=(ci/2)|0;
   tys.forEach(function(ty,i){var x=22+col*195+(i%6)*30*.0+ (i%3)*52,y=64+row*250+((i/3)|0)*58;
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.moveTo(x,y-16*scale);ctx.lineTo(x+32*scale,y);ctx.lineTo(x,y+16*scale);ctx.lineTo(x-32*scale,y);ctx.fill();
    SG.Iso.building(ctx,ty,+(q.get('lv')||4),c,x+ (col?8:6),y,{t:T,scale:scale,night:night});});
   label(c,10+col*195,24+row*250);});
 }
}
if(mode==='measure'){var out=[],B=SG.Iso.building,t0=performance.now(),n=0;
 TYPES.forEach(function(ty){for(var L=1;L<=5;L++)[0,1].forEach(function(d){if(d&&ty!=='port')return;var m=B.measure(ty,L,'cinar',d);n++;out.push(ty+L+(d?'d':'')+':'+Math.round(m.top)+','+Math.round(m.left)+','+Math.round(m.right));});});
 window.__info={build_ms:(performance.now()-t0)/n,n:n,list:out};
 var c2=document.createElement('canvas').getContext('2d');c2.canvas.width=800;c2.canvas.height=800;t0=performance.now();var N=0;
 for(var r=0;r<20;r++)TYPES.forEach(function(ty,i){B(c2,ty,3,'cinar',100+i*30,300,{t:r*.1,scale:1});N++;});
 window.__info.draw_ms=(performance.now()-t0)/N;
}else frame();
if(q.get('anim')==='1'){(function loop(){T=performance.now()/1000;frame();requestAnimationFrame(loop)})()}
window.__ready=true;
</script></body></html>
